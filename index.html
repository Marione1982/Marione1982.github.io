<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le mie app</title>
<meta name="description" content="Accesso rapido alle web app di Mario">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Le mie app">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --text: #1d1f23;
    --muted: #6b6f76;
    --line: #e6e1d8;
    --casa: #2f7d5b;
    --forno: #c4532b;
    --gym: #2f5fb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card: #20232a;
      --text: #f1efe9;
      --muted: #9a9ea6;
      --line: #2e323a;
      --casa: #5cbf90;
      --forno: #ec8459;
      --gym: #7aa2ea;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  main { max-width: 760px; margin: 0 auto; }
  header { margin: 8px 4px 24px; }
  h1 { font-size: clamp(26px, 6vw, 34px); margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0; font-size: 15px; }
  .apps { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .apps { grid-template-columns: repeat(3, 1fr); } }
  a.app {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); color: inherit; text-decoration: none;
    border: 1px solid var(--line); border-radius: 18px;
    padding: 18px; min-height: 92px;
    transition: transform .12s ease, box-shadow .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  @media (min-width: 640px) {
    a.app { flex-direction: column; align-items: flex-start; padding: 22px; min-height: 190px; }
    a.app .arrow { display: none; }
  }
  a.app:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  a.app:active { transform: scale(.98); }
  a.app:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .ico {
    flex: none; width: 56px; height: 56px; border-radius: 16px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    color: var(--accent);
  }
  .ico svg { width: 30px; height: 30px; }
  .txt { flex: 1; min-width: 0; }
  .name { font-size: 19px; font-weight: 650; margin: 0 0 3px; }
  .desc { color: var(--muted); font-size: 14px; line-height: 1.35; margin: 0; }
  .arrow { color: var(--muted); flex: none; }
  .casa { --accent: var(--casa); }
  .forno { --accent: var(--forno); }
  .gym { --accent: var(--gym); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Le mie app</h1>
    <p class="sub">Tocca un'app per aprirla.</p>
  </header>

  <nav class="apps">
    <a class="app casa" href="https://marione1982.github.io/Casa/">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
      </span>
      <span class="txt">
        <p class="name">Casa</p>
        <p class="desc">Bollette, fotovoltaico, movimenti, spese fisse e budget</p>
      </span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>

    <a class="app forno" href="https://marione1982.github.io/PizzeriaMario/">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 20h18L12 3z"/><circle cx="11" cy="13" r="1.3"/><circle cx="14" cy="16.5" r="1.3"/><circle cx="9" cy="17" r="1.3"/></svg>
      </span>
      <span class="txt">
        <p class="name">Forno di casa</p>
        <p class="desc">Serate pizza: ricettario, menu, spesa e impasto</p>
      </span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>

    <a class="app gym" href="https://marione1982.github.io/GymNC/">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><rect x="4" y="7" width="3" height="10" rx="1"/><rect x="17" y="7" width="3" height="10" rx="1"/></svg>
      </span>
      <span class="txt">
        <p class="name">GymNC</p>
        <p class="desc">Diario di allenamento Push / Pull / Legs</p>
      </span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
  </nav>
</main>
</body>
</html>
